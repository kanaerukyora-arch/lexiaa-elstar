<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b18"><title>Admin New · Lexiaa</title>
<style>
:root{color-scheme:dark;--cyan:#70eaff;--purple:#bd9bff;--text:#effaff;--muted:#91a8c0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0,#17385a 0,transparent 45%),radial-gradient(ellipse at 90% 30%,#341d58 0,transparent 40%),#070b18;color:var(--text);font:14px Inter,system-ui,sans-serif;padding:24px}.shell{width:min(980px,100%);margin:auto}.brand{font:700 12px Orbitron,system-ui,sans-serif;letter-spacing:.2em;color:#b8f5ff}.sub{color:var(--muted);font-size:12px;margin:8px 0 24px}.panel{border:1px solid #74dfff55;border-radius:20px;padding:clamp(18px,4vw,30px);background:#101a30c9;backdrop-filter:blur(18px);box-shadow:0 20px 70px #0007;margin:16px 0}h1,h2{font-family:Orbitron,system-ui,sans-serif;letter-spacing:.05em}h1{font-size:clamp(20px,4vw,30px)}h2{font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#9beaff;font-size:10px;letter-spacing:.12em;font-weight:800;margin:14px 0 7px}input,textarea,select{width:100%;border:1px solid #7bdfff55;border-radius:11px;padding:13px;background:#071225;color:white;outline:none}textarea{min-height:130px;resize:vertical}button{border:1px solid #9af0ff;border-radius:11px;padding:13px 18px;background:linear-gradient(100deg,#baf8ff,#62dcf5,#c7a6ff);color:#07111d;font-weight:900;letter-spacing:.08em;cursor:pointer}.secondary{background:#172746;color:#c9efff;border-color:#80dfff66}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.notice{color:#ffb5c3;min-height:20px;margin-top:12px}.notice.ok{color:#9df4d1}.user-list{display:grid;gap:9px;max-height:360px;overflow:auto;margin-top:14px}.user{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #6ddfff38;border-radius:12px;background:#09152a}.user strong{display:block}.user small{color:var(--muted)}.tag{font-size:9px;border:1px solid #a78bfa88;color:#d6c6ff;border-radius:20px;padding:5px 8px;white-space:nowrap}.user button{padding:8px 11px;font-size:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.selected{color:#9cefff;font-size:12px;margin-top:8px}@media(max-width:620px){body{padding:14px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><div class="brand">✦ LEXIAA THE NEXT GENERATION</div><div class="sub">PANEL ADMIN NEW · PESAN PRIBADI</div>
<section class="panel" id="loginPanel"><h1>ADMIN ACCESS</h1><p class="sub">Masukkan kredensial admin untuk membuka panel pengelolaan pesan.</p><form id="loginForm"><label>KATA KUNCI</label><input id="adminKey" autocomplete="username" required><label>PASSWORD</label><input id="adminPassword" type="password" autocomplete="current-password" required><p class="notice" id="loginNotice"></p><button id="loginButton">MASUK PANEL</button></form></section>
<div id="adminPanel" class="hidden"><section class="panel"><div class="top"><div><h1>Pesan Pengguna</h1><p class="sub">Pilih akun Lexiaa Old atau Lexiaa New untuk mengirim pesan pribadi.</p></div><button class="secondary" id="logoutButton">KELUAR</button></div><div class="row"><input id="searchUsers" placeholder="Cari username atau nama tampilan..." style="flex:1;min-width:220px"><button class="secondary" id="refreshUsers">MUAT ULANG</button></div><div class="user-list" id="userList"><p class="sub">Memuat daftar akun...</p></div></section>
<section class="panel"><h2>Kirim Pesan</h2><div class="selected" id="selectedUser">Belum ada penerima dipilih.</div><form id="messageForm"><label>JUDUL PESAN</label><input id="messageTitle" maxlength="140" required placeholder="Contoh: Informasi penting"><label>ISI PESAN</label><textarea id="messageBody" maxlength="5000" required placeholder="Tulis pesan untuk pengguna..."></textarea><p class="notice" id="sendNotice"></p><button id="sendButton">KIRIM PESAN</button></form></section></div></main>
<script type="module">
const URL="https://sudvolmlzunzofzwjbfn.supabase.co/functions/v1/lexiaa-admin";let token=sessionStorage.getItem("lexiaaAdminNewToken")||"",users=[],selected=null;const $=id=>document.getElementById(id);
async function api(payload){const r=await fetch(URL,{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({error:"Respons server tidak valid."}));if(!r.ok)throw Error(d.error||"Permintaan gagal.");return d;}
function paint(){const q=$("searchUsers").value.trim().toLowerCase(),filtered=users.filter(u=>[u.username,u.display_name,u.email_hint].some(v=>(v||"").toLowerCase().includes(q)));$("userList").replaceChildren();if(!filtered.length){$("userList").textContent="Tidak ada akun yang cocok.";return;}for(const u of filtered){const item=document.createElement("div");item.className="user";const info=document.createElement("div"),name=document.createElement("strong"),meta=document.createElement("small"),tag=document.createElement("span"),btn=document.createElement("button");name.textContent=u.display_name||u.username||"Pengguna Lexiaa";meta.textContent=(u.username?"@"+u.username+" · ":"")+ (u.email_hint||"Email privat");tag.className="tag";tag.textContent=u.nextgen_joined_at?"LEXIAA NEW":"LEXIAA OLD";btn.textContent=selected?.id===u.id?"DIPILIH":"PILIH";btn.className="secondary";btn.onclick=()=>{selected=u;$("selectedUser").textContent="Penerima: "+(u.display_name||u.username||"Pengguna")+" · "+tag.textContent;paint();};info.append(name,meta);item.append(info,tag,btn);$("userList").append(item);}}
async function loadUsers(){ $("userList").textContent="Memuat daftar akun...";try{const d=await api({action:"users"});users=d.users||[];paint();}catch(e){$("userList").textContent=e.message;}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginButton").disabled=true;$("loginNotice").textContent="Memverifikasi...";try{const d=await api({action:"login",key:$("adminKey").value,password:$("adminPassword").value});token=d.token;sessionStorage.setItem("lexiaaAdminNewToken",token);$("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");$("loginNotice").textContent="";await loadUsers();}catch(err){$("loginNotice").textContent=err.message;}finally{$("loginButton").disabled=false;}};
$("messageForm").onsubmit=async e=>{e.preventDefault();if(!selected){$("sendNotice").textContent="Pilih penerima terlebih dahulu.";return;}$("sendButton").disabled=true;try{await api({action:"send",recipient_id:selected.id,title:$("messageTitle").value,body:$("messageBody").value});$("sendNotice").textContent="Pesan berhasil dikirim."; $("sendNotice").className="notice ok";$("messageForm").reset();}catch(err){$("sendNotice").textContent=err.message;$("sendNotice").className="notice";}finally{$("sendButton").disabled=false;}};
$("searchUsers").addEventListener("input",paint);$("refreshUsers").onclick=loadUsers;$("logoutButton").onclick=()=>{token="";sessionStorage.removeItem("lexiaaAdminNewToken");selected=null;$("adminPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");$("loginForm").reset();};
if(token){$("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");loadUsers();}
</script></body></html>
